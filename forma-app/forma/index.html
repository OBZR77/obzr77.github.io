<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d171c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Форма">
<title>Форма — домашний тренер</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="tabs" aria-label="Разделы"></nav>
</div>

<section id="player" class="player" hidden aria-live="polite">
  <div class="p-top">
    <button id="pExit" aria-label="Выйти"></button>
    <div class="p-prog"><div id="pBar"></div></div>
    <span id="pElapsed">00:00</span>
    <button id="pVoice" aria-label="Голос"></button>
  </div>
  <div id="pBlock"></div>
  <div class="p-main">
    <div id="pKind"></div>
    <h1 id="pName"></h1>
    <div id="pSet"></div>
    <div class="p-ring">
      <svg viewBox="0 0 200 200" aria-hidden="true"><circle class="bg" cx="100" cy="100" r="90"/><circle class="fg" id="pRing" cx="100" cy="100" r="90"/></svg>
      <div class="p-ringtxt"><div id="pBig">0</div><div id="pUnit"></div></div>
    </div>
    <div id="pCue"></div>
  </div>
  <div id="pNext"></div>
  <button id="pMode" type="button"></button>
  <div class="p-ctrl">
    <button id="pDone" type="button">Готово</button>
    <div class="p-row">
      <button id="pPrev" type="button" aria-label="Назад"></button>
      <button id="pPause" type="button" aria-label="Пауза"></button>
      <button id="pPlus" type="button">+15 с</button>
      <button id="pSkip" type="button" aria-label="Вперёд"></button>
    </div>
  </div>
  <div id="pOverlay" hidden></div>
</section>

<div id="sheet" class="sheet" hidden><div class="panel" id="sheetBody"></div></div>
<div id="toast" class="toast" hidden></div>

<script src="js/data.js"></script>
<script src="js/logic.js"></script>
<script src="js/voice.js"></script>
<script src="js/store.js"></script>
<script src="js/player.js"></script>
<script src="js/app.js"></script>
</body>
</html>
